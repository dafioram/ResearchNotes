<div class="note-body note-body-inline">
  {{ note['html'] | safe }}
</div>

{% if attachments %}
<div class="section">
  <p class="section-title">Attachments</p>
  <ul class="attachment-list">
    {% for a in attachments %}
      <li class="attachment-row">
        <a href="{{ url_for('notes.serve_attachment', file_hash=a['hash']) }}" target="_blank" rel="noopener">
          {{ a['filename'] }}
        </a>
        <span class="size">{{ (a['size'] / 1024) | round(1) }} KB</span>
      </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
