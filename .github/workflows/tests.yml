# Runs on every pull request and on every push to main.
#   tests    -- the fast suite (pytest): ~30 s
#   browser  -- the app driven in Chromium (pytest -m browser): ~1-2 min;
#               a failing test's screenshot is kept as an artifact
#   docker   -- builds the image the way docker compose does, starts it,
#               and checks it serves pages and saves a note
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a running check.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"   # what the Docker image runs

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - run: pytest -m browser
      - name: Keep screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: test-results/
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t research-notes .
      - name: Start
        run: |
          docker run -d --name research-notes -p 5000:5000 research-notes
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:5000/ && exit 0
            sleep 1
          done
          docker logs research-notes
          exit 1
      - name: Serves pages and saves a note
        run: |
          curl -fsS -o /dev/null http://localhost:5000/notes/new
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            --data-urlencode 'body=# Saved by CI' --data-urlencode 'sort_date=2026-01-01' \
            http://localhost:5000/notes/new)
          test "$status" = 302
          curl -fsS 'http://localhost:5000/?q=saved' | grep -q 'Saved by CI'
      - name: Logs
        if: always()
        run: docker logs research-notes || true
